services:
  # Primary MongoDB service running as a single-node replica set (rs0).
  # A replica set is required for MongoDB multi-document transactions and change streams.
  mongodb:
    image: mongo:7
    container_name: express-template-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  # Automated one-time replica set initializer.
  #
  # Why this is needed:
  # 1. When mongod starts with '--replSet rs0', it remains in an uninitialized state
  #    ('ConfigUninitialized') until 'rs.initiate()' is executed. Without this,
  #    drivers (like Mongoose) time out waiting for a primary node election.
  # 2. 'host: localhost:27017' is specified so that host applications connecting
  #    via the forwarded port '127.0.0.1:27017' can discover and reach the primary node.
  # 3. This service waits for MongoDB to be healthy, checks if rs0 is already initialized
  #    (idempotent), initiates if missing, and immediately exits.
  mongodb-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongodb:27017 --eval '
          try {
            if (rs.status().ok === 1) {
              console.log("MongoDB replica set rs0 is already initialized.");
            }
          } catch (e) {
            console.log("Initializing MongoDB replica set rs0...");
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "localhost:27017" }]
            });
            console.log("MongoDB replica set rs0 initialized successfully.");
          }
        '

  redis:
    image: redis:7.4.9-alpine3.21
    container_name: express-template-redis
    ports:
      - "6379:6379"

volumes:
  mongodb_data:

